server:
  port: 9494

spring:
  application:
    name: spring-openai-demo

  main:
    web-application-type: NONE
    banner-mode: OFF

  ai:
    openai:
      api-key: ${OPEN_API_KEY}

    mcp:
      server:
        enabled: true
        name: ai-support-mcp
        type: SYNC
        stdio: true

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: create-drop

    show-sql: false

    properties:
      hibernate:
        format_sql: false

    defer-datasource-initialization: true

  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    root: OFF